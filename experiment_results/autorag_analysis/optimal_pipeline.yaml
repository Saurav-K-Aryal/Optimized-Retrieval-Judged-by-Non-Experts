_note: Selected by autorag_parse.py. The prompt template below is the tied template AutoRAG scored; it hard-codes one question. Replace it with a template that uses {query} before deployment.
node_lines:
- node_line_name: retrieve_node_line
  nodes:
  - node_type: retrieval
    strategy:
      metrics:
      - retrieval_ndcg
      - retrieval_map
      - retrieval_mrr
      - retrieval_f1
      - retrieval_recall
      - retrieval_precision
    top_k: 20
    modules:
    - module_type: hybrid_cc
      target_modules: ('bm25', 'vectordb')
      weights:
      - (0.5, 0.5)
      _vectordb_embedding_model: huggingface_all_mpnet_base_v2
  - node_type: passage_reranker
    strategy:
      metrics:
      - retrieval_f1
      - retrieval_recall
      - retrieval_precision
    top_k: 3
    modules:
    - module_type: pass_reranker
- node_line_name: post_retrieve_node_line
  nodes:
  - node_type: prompt_maker
    strategy:
      metrics:
      - sem_score
      - meteor
      - rouge
      - bleu
    modules:
    - module_type: fstring
      prompt:
      - "You are a US Naval Officer. \n\nWhat are the standard operating procedures you, as the Naval officer, use to determine whether or not to run/flee or engage an approaching friendly ship?\n\nUsing\
        \ the following information as context, please provide a detailed answer:\n\n{retrieved_contents}\n\nAnswer:"
      - 'You are a US Naval Officer.


        {query}


        Using the following information as context, please provide a detailed answer:


        {retrieved_contents}


        Answer:'
  - node_type: generator
    strategy:
      metrics:
      - bleu
      - rouge
      - meteor
      - sem_score
      - bert_score
    modules:
    - module_type: llama_index_llm
      llm: ollama
      model: llama3.1
      request_timeout: 30
      temperature: 0.1
      top_p: 0.5
      top_k: 10
      min_p: 0.1
      max_length: 512
      context_length: 512
      prompt_batch_size: 16
      repeat_penalty_tokens: 5
      repeat_penalty: 1.2
